  schemas:
    Program:
      type: object
      description: A program (e.g. KBB, CPO, Credit Line) and its configuration root.
      x-aep-resource:
        patterns:
        - programs/{program}
        singular: program
        plural: programs
        type: msrestapi.com/programs/program
      required:
      - name
      - slug
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
          description: Lowercase letters, digits and single hyphens. Unique among non-deleted programs
            (case-insensitive). IMMUTABLE after create. `GET /programs/{program}` accepts it in place
            of the id.
        description:
          type: string
          nullable: true
        level:
          type: string
          enum:
          - user
          - organization
          - location
          default: location
          description: The customer-hierarchy grain the program is anchored at.
        active:
          type: boolean
        config_version:
          type: integer
          format: int32
          readOnly: true
          description: Bumped on every configuration change (level, active, and later settings); compared
            with the latest publication to detect drift.
        config_hash:
          type: string
          readOnly: true
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true
        state:
          $ref: '#/components/schemas/ResourceState'
    Blueprint:
      type: object
      description: Starting point for the create-program wizard. Its modules and default config are copied
        into the program at creation.
      x-aep-resource:
        patterns:
        - blueprints/{blueprint}
        singular: blueprint
        plural: blueprints
        type: msrestapi.com/programs/blueprint
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          description: Stable identifier, e.g. `kbb`, `cpo`. Unique among non-deleted blueprints.
        name:
          type: string
        description:
          type: string
          nullable: true
        active:
          type: boolean
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true
        state:
          $ref: '#/components/schemas/ResourceState'
      required:
      - key
      - name
    ModuleDefinition:
      type: object
      description: A node of the module tree (group or leaf). Seeded; the tree can nest to any depth.
      x-aep-resource:
        patterns:
        - module-definitions/{module_definition}
        singular: module-definition
        plural: module-definitions
        type: msrestapi.com/programs/module-definition
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          description: Stable dotted key, e.g. `catalog_pricing.products_rules.pre_enrollment`.
        name:
          type: string
        kind:
          type: string
          enum:
          - group
          - leaf
        parent_id:
          type: string
          format: uuid
          nullable: true
        ancestry:
          type: string
          description: ltree-style path; allows fetching a whole subtree at any depth.
        position:
          type: integer
          format: int32
        ui_component:
          type: string
          nullable: true
