        module switched on (400 otherwise). Files are data, not configuration: this does not change `config_version`.
        It writes an audit entry and an outbox event in the same transaction.'
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentFolder'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFolder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: DeleteDocumentFolder
      summary: Delete a folder
      tags:
      - document-folders
      description: 'A system folder, or a folder that still has files or sub-folders, cannot be deleted
        (409). The program must have the Documents Panel module switched on (400 otherwise). Files are
        data, not configuration: this does not change `config_version`. It writes an audit entry and an
        outbox event in the same transaction.'
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      responses:
        '204':
          $ref: '#/components/responses/EmptyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}/documents:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    get:
      operationId: ListDocuments
      summary: List files
      tags:
      - documents
      description: 'Newest first, paged by id. `location=recent` is the newest 20 (no next page), `needs_review`
        and `quarantined` read tiny indexes; `folder_id` picks a folder; `q` is a name prefix. Files still
        uploading are in no list. The program must have the Documents Panel module switched on (400 otherwise).
        Files are data, not configuration: this does not change `config_version`.'
      parameters:
      - $ref: '#/components/parameters/maxPageSize'
      - $ref: '#/components/parameters/pageToken'
      - name: folder_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: location
        in: query
        required: false
        schema:
          type: string
          enum:
          - recent
          - needs_review
          - quarantined
        description: Omit for All files.
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: A prefix of the file name, any case.
      responses:
        '200':
          $ref: '#/components/responses/DocumentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: CreateDocument
      summary: Start an upload
      tags:
      - documents
      description: 'Step 1 of 3. Checks the declared size and type (413 / 415 before anything is made),
        creates the row as `uploading` (hidden from every list, not counted) and returns a presigned `upload`
        request: `PUT` the file bytes to `upload.url` with exactly `upload.headers`. The URL is for one
        object key, expires in minutes, and has the type, size and (if given) SHA-256 signed in, so the
        storage itself refuses anything else. Then call `:complete`. The program must have the Documents
        Panel module switched on (400 otherwise). Files are data, not configuration: this does not change
        `config_version`.'
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Document'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}/documents/{document}:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    - name: document
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the document.
    get:
      operationId: GetDocument
      summary: Get a file
      tags:
      - documents
      description: 'One file''s metadata, including one that is still `uploading` so its upload can be
        followed. The program must have the Documents Panel module switched on (400 otherwise). Files
        are data, not configuration: this does not change `config_version`.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: UpdateDocument
      summary: Rename or move a file
      tags:
      - documents
      description: '`name` renames, `folder_id` moves; the folder counters follow in the same transaction.
        A request that changes nothing writes nothing. The program must have the Documents Panel module
        switched on (400 otherwise). Files are data, not configuration: this does not change `config_version`.
        It writes an audit entry and an outbox event in the same transaction.'
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Document'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: DeleteDocument
      summary: Delete a file
      tags:
      - documents
      description: 'A soft delete: the totals and the folder counter follow. (The object stays in the
        storage until its retention rule removes it.) The program must have the Documents Panel module
        switched on (400 otherwise). Files are data, not configuration: this does not change `config_version`.
        It writes an audit entry and an outbox event in the same transaction.'
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      responses:
        '204':
          $ref: '#/components/responses/EmptyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}/documents/{document}:complete:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    - name: document
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the document.
    post:
      operationId: :CompleteDocument
      summary: Finish an upload
      tags:
      - documents
      description: 'Step 3 of 3. The server asks the STORAGE what arrived (never the browser) and checks
        that the object exists (409 if not), and that its size, type and SHA-256 match what was declared
        (422 otherwise). The file becomes `pending_scan`, is counted in the totals and the folder, and
        the outbox event the scanner listens to is written. Completing a file that is already past `uploading`
        returns it unchanged. The program must have the Documents Panel module switched on (400 otherwise).
        Files are data, not configuration: this does not change `config_version`.'
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}/documents/{document}:download:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    - name: document
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the document.
    post:
      operationId: :DownloadDocument
      summary: Get a download link
      tags:
      - documents
      description: 'Returns a short-lived presigned `download` request: the browser downloads from the
        storage (as an attachment named after the file), not from this service. Not allowed while the
        file is `quarantined` or still `uploading` (409). The program must have the Documents Panel module
        switched on (400 otherwise). Files are data, not configuration: this does not change `config_version`.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadDocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}/documents/{document}:review:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    - name: document
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the document.
    post:
      operationId: :ReviewDocument
      summary: Review a file that needs review
      tags:
      - documents
      description: '`approve` makes the file `ok`, `reject` quarantines it. Only a file that is `needs_review`
        can be reviewed (409). The reviewer and note are recorded. The program must have the Documents
        Panel module switched on (400 otherwise). Files are data, not configuration: this does not change
        `config_version`. It writes an audit entry and an outbox event in the same transaction.'
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - reject
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /webhooks/document-scan:
    post:
      operationId: ReceiveDocumentScanEvent
      summary: The scanner's verdict on a file
      tags:
      - documents
      description: An internal callback, not an AEP resource. `clean` makes a file that is `pending_scan`
        `ok`, `suspicious` makes it `needs_review`, `infected` quarantines it, and the page's counters
        follow. A file that is not waiting for a scan is left as it is, so a repeated callback is harmless.
        When a scan webhook secret is configured, the `X-Webhook-Secret` header must carry it. Answers
        204.
      x-ignore-rules:
      - rule: aep-133-id-parameter
        reason: An internal event receiver, not an AEP resource.
      parameters:
      - name: X-Webhook-Secret
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentScanEvent'
      responses:
        '204':
          $ref: '#/components/responses/EmptyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-ms_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your bearer token in the format **Bearer token**
    clientIdHeader:
      type: apiKey
      in: header
      name: X-Client-ID
      description: Client ID for service-to-service authentication
    clientSecretHeader:
      type: apiKey
      in: header
      name: X-Client-Secret
      description: Client secret for service-to-service authentication
  parameters:
    clientId:
      name: id
      in: query
      required: false
      schema:
        type: string
      description: Optional client-specified ID for the resource being created (AEP-133). Must be a valid
        UUID; the server generates one if omitted.
    pageToken:
      name: page_token
      in: query
      required: false
      schema:
        type: string
      description: The next_page_token value returned from a previous list request.
    maxPageSize:
      name: max_page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
      description: The maximum number of items to return per page.
    showDeleted:
      name: show_deleted
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: AEP-135 soft-delete flag. When false (default) only active resources are returned;
        when true, only soft-deleted resources are returned (the list does not mix the two).
  responses:
    BadRequest:
      description: The request was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: The request was well-formed but a field's value violates a format rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: An internal server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmptyResponse:
      description: Successful response (no content).
    ProgramsResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            x-aep-resource:
              patterns:
              - programs/{program}
              singular: program
              plural: programs
              type: msrestapi.com/programs/program
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/Program'
              next_page_token:
                type: string
                nullable: true
              total_size:
                type: integer
                format: int64
    ModuleDefinitionsResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            x-aep-resource:
              patterns:
              - module-definitions/{module_definition}
              singular: module-definition
              plural: module-definitions
              type: msrestapi.com/programs/module-definition
            properties:
              results:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/ModuleDefinition'
                  - $ref: '#/components/schemas/ModuleDefinitionTreeNode'
                  description: Flat `ModuleDefinition`s, or nested `ModuleDefinitionTreeNode`s when `full_tree=true`.
              next_page_token:
                type: string
                nullable: true
              total_size:
                type: integer
                format: int64
    ProgramModulesResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            x-aep-resource:
              patterns:
              - programs/{program}/modules/{module}
              singular: program-module
              plural: program-modules
              type: msrestapi.com/programs/program-module
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramModule'
    AuditLogsResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            x-aep-resource:
              patterns:
              - programs/{program}/audit-logs/{audit_log}
              singular: audit-log
              plural: audit-logs
              type: msrestapi.com/programs/audit-log
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
              next_page_token:
                type: string
                nullable: true
              total_size:
                type: integer
                format: int64
    Conflict:
      description: 'The change lost a race: the data moved on since it was read (for example a stale `version`).
        Reload and try again.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EnrollmentsResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            x-aep-resource:
              patterns:
              - programs/{program}/enrollments/{enrollment}
              singular: enrollment
              plural: enrollments
              type: msrestapi.com/programs/enrollment
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/Enrollment'
              next_page_token:
                type: string
                nullable: true
              total_size:
                type: integer
                format: int64
                description: How many enrollments match the filters (the "N STORES" count).
    StoreDiscountsResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            x-aep-resource:
              patterns:
              - programs/{program}/store-discounts/{enrollment}
              singular: store-discount
              plural: store-discounts
              type: msrestapi.com/programs/store-discount
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/StoreDiscount'
              next_page_token:
                type: string
                nullable: true
              total_size:
                type: integer
                format: int64
                description: How many enrolled stores match the filters.
    RuleSetsResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            x-aep-resource:
              patterns:
              - programs/{program}/rule-sets/{rule_set}
              singular: rule-set
              plural: rule-sets
              type: msrestapi.com/programs/rule-set
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/RuleSet'
    RuleVersionsResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            x-aep-resource:
              patterns:
              - programs/{program}/rule-sets/{rule_set}/versions/{version}
              singular: rule-version
              plural: rule-versions
              type: msrestapi.com/programs/rule-version
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/RuleVersion'
              next_page_token:
                type: string
                nullable: true
    PublicationsResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            x-aep-resource:
              patterns:
              - programs/{program}/publications/{publication}
              singular: publication
              plural: publications
              type: msrestapi.com/programs/publication
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/Publication'
              next_page_token:
                type: string
                nullable: true
    PayloadTooLarge:
      description: The file is bigger than the limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: The file type is not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentsResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            x-aep-resource:
              patterns:
              - programs/{program}/documents/{document}
              singular: document
              plural: documents
              type: msrestapi.com/programs/document
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              next_page_token:
                type: string
                nullable: true
    DocumentFoldersResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            x-aep-resource:
              patterns:
              - programs/{program}/document-folders/{folder}
              singular: document-folder
              plural: document-folders
              type: msrestapi.com/programs/document-folder
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentFolder'
  schemas:
    Program:
      type: object
      description: A program (e.g. KBB, CPO, Credit Line) and its configuration root.
      x-aep-resource:
        patterns:
        - programs/{program}
        singular: program
        plural: programs
        type: msrestapi.com/programs/program
      required:
      - name
      - slug
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
          description: Lowercase letters, digits and single hyphens. Unique among non-deleted programs
            (case-insensitive). IMMUTABLE after create. `GET /programs/{program}` accepts it in place
            of the id.
        description:
          type: string
          nullable: true
        level:
          type: string
          enum:
          - user
          - organization
          - location
          default: location
          description: The customer-hierarchy grain the program is anchored at.
        active:
          type: boolean
        config_version:
          type: integer
          format: int32
          readOnly: true
          description: Bumped on every configuration change (level, active, and later settings); compared
            with the latest publication to detect drift.
        config_hash:
          type: string
          readOnly: true
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true
        state:
          $ref: '#/components/schemas/ResourceState'
    ModuleDefinition:
      type: object
      description: A node of the module tree (group or leaf). Seeded; the tree can nest to any depth.
      x-aep-resource:
        patterns:
        - module-definitions/{module_definition}
        singular: module-definition
        plural: module-definitions
        type: msrestapi.com/programs/module-definition
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          description: Stable dotted key, e.g. `catalog_pricing.products_rules.pre_enrollment`.
        name:
          type: string
        kind:
          type: string
          enum:
          - group
          - leaf
        parent_id:
          type: string
          format: uuid
          nullable: true
        ancestry:
          type: string
          description: ltree-style path; allows fetching a whole subtree at any depth.
        position:
          type: integer
          format: int32
        ui_component:
          type: string
          nullable: true
          description: 'How the frontend renders a leaf: `rule_playground`, `field_form`, or `custom:<name>`.'
        rule_family:
          type: string
          nullable: true
          description: GoRules family for rule leaves, e.g. `pre_enrollment`.
        universal:
          type: boolean
          description: True when every program gets this module.
        requires_publish:
          type: boolean
          description: True when changes only take effect after a Publication.
        permission_key:
          type: string
          nullable: true
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true
        source:
          type: string
          enum:
          - premade
          - container
          - default
          description: '`premade`: code-backed, selected by the admin. `container`: the admin adds components.
            `default`: Overview, on every program.'
        handler_key:
          type: string
          nullable: true
          description: The code that handles a premade or default module.
        api_base:
          type: string
          nullable: true
          description: The API the frontend calls for it.
        selectable:
          type: boolean
          description: False for Overview, which is always on.
        allow_components:
          type: boolean
          description: The admin may add settings or rules here.
        default_mode:
          type: string
          nullable: true
          enum:
          - rule
          - settings
          description: 'The mode a program gets when it selects this page, without the admin choosing it. A `rule`
            page also starts with a simple saved rule (draft 1). Null for a page the admin configures freely.'
    ProgramModule:
      type: object
      description: 'One entry of a program''s module manifest. `source` tells the frontend how to draw
        it: `premade` calls `api_base`, `container` renders its components, `default` is the Overview.'
      x-aep-resource:
        patterns:
        - programs/{program}/modules/{module}
        singular: program-module
        plural: program-modules
        type: msrestapi.com/programs/program-module
      properties:
        path:
          type: string
          readOnly: true
        module_id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - group
          - leaf
        parent_id:
          type: string
          format: uuid
          nullable: true
        ancestry:
          type: string
        source:
          type: string
          enum:
          - premade
          - container
          - default
        handler_key:
          type: string
          nullable: true
        api_base:
          type: string
          nullable: true
          description: The API the frontend calls for a premade module, e.g. `applications`.
        ui_component:
          type: string
          nullable: true
        allow_components:
          type: boolean
          description: True when the admin chooses what this leaf is (Rule or Settings).
        requires_publish:
          type: boolean
        enabled:
          type: boolean
        position:
          type: integer
          format: int32
        update_time:
          type: string
          format: date-time
          readOnly: true
        mode:
          type: string
          enum:
          - rule
          - settings
          nullable: true
          description: 'What the admin made this leaf: `rule` (the leaf IS a rule-engine rule set) or
            `settings` (the admin adds settings to it). Null until chosen, and always null on a module
            that is not configurable (`allow_components` false). The leaf''s name is fixed by the module,
            so there is nothing to name. Premade modules can only be `settings`.'
        settings:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSetting'
          description: Present when `mode` is `settings`.
        rule:
          $ref: '#/components/schemas/ProgramRule'
    Enrollment:
      type: object
      description: A store enrolled in a program on one website (a row of the Enrolled Stores page). Created
        by an admin, in bulk, or automatically when an application is approved. A store can have one live
        (pending, active or suspended) enrollment per program and website.
      x-aep-resource:
        patterns:
        - programs/{program}/enrollments/{enrollment}
        singular: enrollment
        plural: enrollments
        type: msrestapi.com/programs/enrollment
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        application_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: The application that produced it, when there was one.
        store_id:
          type: string
          minLength: 1
          maxLength: 64
        store_name:
          type: string
          nullable: true
          maxLength: 200
          description: '`null` = show "Unresolved store".'
        store_resolved:
          type: boolean
          readOnly: true
          description: '`false` when no store name was known at enroll time.'
        website_id:
          type: string
          minLength: 1
          maxLength: 64
        website_name:
          type: string
          nullable: true
          maxLength: 200
        customer_group:
          type: string
          nullable: true
          maxLength: 64
        status:
          type: string
          enum:
          - pending
          - active
          - suspended
          - ended
          description: 'On create: `pending` or `active` (default). Changes: pending -> active, active
            <-> suspended, anything -> ended (final).'
        actions:
          type: array
          readOnly: true
          items:
            type: string
            enum:
            - active
            - suspended
            - ended
          description: The status changes allowed from here (the Actions dropdown).
        enrolled_time:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When it first became active; `null` while still pending.
        contracts_count:
          type: integer
          format: int32
          readOnly: true
          description: Always 0 until agreements are built.
        last_contract_time:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - store_id
      - website_id
    AuditLog:
      type: object
      description: Who changed what, with before and after. Read-only; backs History and View changes.
      x-aep-resource:
        patterns:
        - programs/{program}/audit-logs/{audit_log}
        singular: audit-log
        plural: audit-logs
        type: msrestapi.com/programs/audit-log
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        before:
          type: object
          additionalProperties: true
          nullable: true
        after:
          type: object
          additionalProperties: true
          nullable: true
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true
        summary:
          type: string
          example: Settings updated
          description: The line a history list shows.
    FieldValue:
      type: object
      description: The saved value of one setting.
      properties:
        setting_id:
          type: string
          format: uuid
        module_key:
          type: string
        key:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - boolean
          - number
          - text
          - radio
          - checkbox
          - dropdown
        value:
          description: A boolean, number or text.
        option_ids:
          type: array
          items:
            type: string
            format: uuid
          description: The chosen options of a radio / checkbox / dropdown.
        update_time:
          type: string
          format: date-time
          readOnly: true
    Error:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
          example: 400
        message:
          type: string
          example: The request was invalid.
        detail:
          type: string
          example: INVALID_ARGUMENT
        details:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: field_violation
              field:
                type: string
                example: name
              description:
                type: string
                example: Name is required
    ResourceState:
      type: string
      readOnly: true
      enum:
      - STATE_UNSPECIFIED
      - ACTIVE
      - DELETED
      description: AEP-216 resource state, used per AEP-135 as the soft-delete marker. DELETED resources
        are excluded from Get/List by default and surfaced with show_deleted=true.
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          example: ok
    ModuleDefinitionTreeNode:
      description: A module with its descendants nested under `children` (`full_tree=true`). Carries every
        ModuleDefinition field.
      allOf:
      - $ref: '#/components/schemas/ModuleDefinition'
      type: object
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/ModuleDefinitionTreeNode'
    ProgramWithModules:
      type: object
      description: 'Create''s response: the program plus the module manifest it was created with.'
      x-aep-resource:
        patterns:
        - programs/{program}
        singular: program
        plural: programs
        type: msrestapi.com/programs/program
      required:
      - name
      - slug
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
          description: Lowercase letters, digits and single hyphens. Unique among non-deleted programs
            (case-insensitive). IMMUTABLE after create. `GET /programs/{program}` accepts it in place
            of the id.
        description:
          type: string
          nullable: true
        level:
          type: string
          enum:
          - user
          - organization
          - location
          default: location
          description: The customer-hierarchy grain the program is anchored at.
        active:
          type: boolean
        config_version:
          type: integer
          format: int32
          readOnly: true
          description: Bumped on every configuration change (level, active, and later settings); compared
            with the latest publication to detect drift.
        config_hash:
          type: string
          readOnly: true
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true
        state:
          $ref: '#/components/schemas/ResourceState'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ProgramModule'
    OptionConfig:
      type: object
      required:
      - label
      description: One of the admin's own options for a radio, checkbox or dropdown setting.
      properties:
        code:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]+$
          description: 'The option''s identity. Omitted means it is derived from the label. Options are
            matched by code on update: a code that is no longer listed is deactivated (not deleted), so
            saved values never lose their option.'
        label:
          type: string
          minLength: 1
          maxLength: 120
    SettingConfig:
      type: object
      required:
      - name
      - type
      description: One setting on a leaf whose mode is `settings`. The read-only fields a manifest returns
        (`key`, `render`, `position`, `options_source`, ...) are accepted and ignored, so a setting can
        be sent straight back after editing.
      properties:
        id:
          type: string
          format: uuid
          description: Present for an existing setting (kept and updated); absent for a new one.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Shown to the admin. The setting's `key` is generated from it and never changes.
        type:
          type: string
          enum:
          - boolean
          - number
          - text
          - radio
          - checkbox
          - dropdown
          description: 'Decides the control: boolean = Yes/No, number, text, radio, checkbox, dropdown.
            A type cannot change once the setting has saved values.'
        required:
          type: boolean
          default: false
        default:
          description: 'The starting value: a boolean, number, text, an option code (radio / dropdown),
            or a list of option codes (checkbox). Must match the type; for manual options it must be one
            of their codes.'
          nullable: true
        library_id:
          type: string
          format: uuid
          description: A global-settings library. For radio / checkbox / dropdown only. The library is
            then the ONLY source of the options (nothing is copied), and it must exist.
        options:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OptionConfig'
          description: 'The admin''s own options: the ONLY source when there is no `library_id`. Giving
            both a library and options is rejected. Radio, checkbox and dropdown need one of the two;
            boolean, number and text take neither.'
    ModuleConfig:
      type: object
      required:
      - key
      additionalProperties: false
      description: A module the admin picked, with what they made of it. An unknown property (for example
        `setting` instead of `settings`) is rejected by name.
      properties:
        key:
          type: string
          example: catalog_pricing.products_rules.warranty
        enabled:
          type: boolean
          description: '`false` switches the module off; its data is kept.'
        mode:
          type: string
          enum:
          - rule
          - settings
          description: 'What the admin makes this leaf: `rule` (the leaf IS the rule engine, which the
            frontend renders) or `settings`. Only on a configurable module (`allow_components`); a premade
            module can only be `settings`. Cannot change while the leaf still has settings or a rule with
            versions.'
        settings:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SettingConfig'
          description: 'Needs `mode: settings`. REPLACES the module''s settings: items with an `id` are
            kept and updated, items without one are created, and the rest are removed (their saved values
            survive). Omit to leave the settings alone; send `[]` to remove them all.'
    SettingOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Ours for a manual option, the library's for a library option.
        code:
          type: string
        label:
          type: string
        source:
          type: string
          enum:
          - manual
          - library
        active:
          type: boolean
    ProgramSetting:
      type: object
      description: One setting of a `settings` leaf, with what the frontend needs to draw it.
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - boolean
          - number
          - text
          - radio
          - checkbox
          - dropdown
        render:
          type: string
          enum:
          - yes_no
          - number_input
          - text_input
          - radio_group
          - checkbox_group
          - dropdown
          description: The control to draw.
        required:
          type: boolean
        default:
          nullable: true
        position:
          type: integer
          format: int32
        options_source:
          type: string
          enum:
          - manual
          - library
          nullable: true
          description: For radio / checkbox / dropdown; null for the other types.
        library_id:
          type: string
          format: uuid
          nullable: true
        options:
          type: array
          items:
            $ref: '#/components/schemas/SettingOption'
          description: Manual options from our database, or the library's active options read live from
            global-settings (served from memory, refreshed in the background and cleared the moment global-settings
            reports a change). Empty for boolean / number / text.
        library_error:
          type: string
          enum:
          - not_found
          - unavailable
          nullable: true
          description: Set when the library's options could not be read; the rest of the page still loads.
        value:
          description: The saved value of a boolean / number / text setting; null until one is saved.
        option_ids:
          type: array
          items:
            type: string
            format: uuid
          description: The saved choice of a radio / checkbox / dropdown setting.
        missing_option_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Saved options that are no longer on offer (deactivated, or gone from their library).
            Warn the admin and let them choose again; they can no longer be chosen.
    ProgramRule:
      type: object
      description: 'A rule leaf''s rule-set summary. The rule engine itself is a front-end component;
        `mode: rule` is what tells the frontend to render it.'
      properties:
        rule_type:
          type: string
          nullable: true
        draft_version:
          type: integer
          format: int32
          nullable: true
        published_version:
          type: integer
          format: int32
          nullable: true
    FieldValuePatch:
      type: object
      description: 'One setting''s new value: `value` for a boolean / number / text setting, `option_ids`
        for a radio / checkbox / dropdown. A `null` entry, or an entry with neither field, clears the
        value.'
      properties:
        value:
          description: A boolean, number or text (any JSON value; `null` clears).
        option_ids:
          type: array
          items:
            type: string
            format: uuid
    ListFieldValuesResponse:
      type: object
      properties:
        version:
          type: integer
          format: int32
          description: 'The program''s `config_version`: send it back with a save to detect a concurrent
            change.'
        results:
          type: array
          items:
            $ref: '#/components/schemas/FieldValue'
    BatchUpdateFieldValuesResponse:
      type: object
      properties:
        version:
          type: integer
          format: int32
          description: The `config_version` after the save (unchanged when nothing changed).
        changed:
          type: integer
          format: int32
          description: How many values actually changed. A value sent unchanged is not a change.
        results:
          type: array
          items:
            $ref: '#/components/schemas/FieldValue'
    OverviewStats:
      type: object
      properties:
        total_applications:
          type: integer
          format: int32
        pending_approvals:
          type: integer
          format: int32
        active_enrollments:
          type: integer
          format: int32
        enrollments_total:
          type: integer
          format: int32
      description: The Overview counters. One row per program, kept up to date by the changes that move
        them, so the page never counts anything.
    FunnelEntry:
      type: object
      properties:
        status:
          type: string
          enum:
          - draft
          - submitted
          - in_review
          - approved
          - rejected
          - withdrawn
        count:
          type: integer
          format: int64
    RuleFamilyStatus:
      type: object
      properties:
        module_key:
          type: string
        name:
          type: string
        rule_type:
          type: string
          nullable: true
        state:
          type: string
          enum:
          - empty
          - never
          - drifted
          - in_sync
          description: '`empty`: no rules saved yet. `never`: saved, never published. `drifted`: a newer
            draft than what is live. `in_sync`.'
        draft_version:
          type: integer
          format: int32
          nullable: true
        published_version:
          type: integer
          format: int32
          nullable: true
    PublishedRules:
      type: object
      properties:
        total:
          type: integer
        in_sync:
          type: integer
        drift_detected:
          type: boolean
          description: At least one rule is not in sync with what is live.
        families:
          type: array
          items:
            $ref: '#/components/schemas/RuleFamilyStatus'
          description: The program's enabled rule leaves.
    Overview:
      type: object
      description: 'The default page every program has (a singleton: one per program, no id). Read in
        ONE database round trip.'
      properties:
        program:
          $ref: '#/components/schemas/Program'
        config_version:
          type: integer
          format: int32
        published_config_version:
          type: integer
          format: int32
          nullable: true
          description: The `config_version` of the latest publication; null when never published.
        unpublished_changes:
          type: boolean
          description: The program changed after it was last published, or changed since it was created
            and was never published.
        stats:
          $ref: '#/components/schemas/OverviewStats'
        funnel:
          type: array
          items:
            $ref: '#/components/schemas/FunnelEntry'
          description: Applications by workflow status. Every status is listed, with 0 when there are
            none, so the page always draws the same funnel.
        published_rules:
          $ref: '#/components/schemas/PublishedRules'
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
          description: The latest 10 changes, newest first.
    BatchEnrollmentItemResult:
      type: object
      properties:
        store_id:
          type: string
        website_id:
          type: string
        outcome:
          type: string
          enum:
          - created
          - already_enrolled
          - failed
        enrollment_id:
          type: string
          format: uuid
          description: Only when `created`.
        error:
          type: string
          description: Only when `failed`.
    BatchCreateEnrollmentsResponse:
      type: object
      properties:
        created:
          type: integer
          format: int32
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchEnrollmentItemResult'
          description: One per item, in the order sent.
    DiscountConfig:
      type: object
      description: 'What ONE level sets. A field that is `null` is not set at that level: it is inherited
        from the level above (Program -> Domain -> Store).'
      properties:
        enabled:
          type: boolean
          nullable: true
        type:
          type: string
          enum:
          - percentage
          - fixed
          nullable: true
        amount:
          type: number
          nullable: true
          minimum: 0
          maximum: 1000000
          description: At most 2 decimal places. A percentage cannot be more than 100.
        currency_code:
          type: string
          nullable: true
          pattern: ^[A-Z]{3}$
          example: USD
    DiscountPatch:
      type: object
      description: 'A change to one level, field by field: a field you leave out is untouched, a field
        set to `null` goes back to the inherited value, a field with a value is set.'
      properties:
        enabled:
          type: boolean
          nullable: true
        type:
          type: string
          enum:
          - percentage
          - fixed
          nullable: true
        amount:
          type: number
          nullable: true
          minimum: 0
          maximum: 1000000
        currency_code:
          type: string
          nullable: true
          pattern: ^[A-Z]{3}$
    ResolvedDiscount:
      type: object
      description: 'The discount a store actually gets: every field taken from the highest level that
        set it. With nothing set anywhere it is disabled, a percentage, of 0.'
      properties:
        enabled:
          type: boolean
        type:
          type: string
          enum:
          - percentage
          - fixed
        amount:
          type: number
        currency_code:
          type: string
          nullable: true
    DiscountSources:
      type: object
      description: Which level each resolved field came from (the badge next to each field). A field no
        level set reads `program`.
      properties:
        enabled:
          type: string
          enum:
          - program
          - domain
          - store
        type:
          type: string
          enum:
          - program
          - domain
          - store
        amount:
          type: string
          enum:
          - program
          - domain
          - store
        currency_code:
          type: string
          enum:
          - program
          - domain
          - store
    StoreDiscount:
      type: object
      description: An enrolled store with its discount worked out (a row of the Store Discounts page,
        and what the edit panel opens with).
      x-aep-resource:
        patterns:
        - programs/{program}/store-discounts/{enrollment}
        singular: store-discount
        plural: store-discounts
        type: msrestapi.com/programs/store-discount
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
          description: The enrollment id.
        store_id:
          type: string
          readOnly: true
        store_name:
          type: string
          nullable: true
          readOnly: true
        website_id:
          type: string
          readOnly: true
        website_name:
          type: string
          nullable: true
          readOnly: true
        enrollment_status:
          type: string
          enum:
          - pending
          - active
          - suspended
          readOnly: true
        resolved:
          $ref: '#/components/schemas/ResolvedDiscount'
        sources:
          $ref: '#/components/schemas/DiscountSources'
        set_at:
          type: string
          enum:
          - program
          - domain
          - store
          readOnly: true
          description: 'The Set At column: the highest level that set anything. `program` = "From program".'
        store_override:
          $ref: '#/components/schemas/DiscountConfig'
        inherited:
          allOf:
          - $ref: '#/components/schemas/ResolvedDiscount'
          description: What the store would get if its own override were reverted.
    BatchStoreDiscountsResponse:
      type: object
      properties:
        updated:
          type: integer
          format: int32
          description: How many stores really changed.
        results:
          type: array
          items:
            $ref: '#/components/schemas/StoreDiscount'
          description: Every requested store, in the order sent.
    DiscountLevels:
      type: object
      properties:
        program:
          $ref: '#/components/schemas/DiscountConfig'
        domains:
          type: array
