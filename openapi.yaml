  /programs/{program}/modules:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    get:
      operationId: ListProgramModules
      summary: List a program's modules (the manifest)
      tags:
      - program-modules
      description: 'Every module the program has chosen, ordered parents-first (shallowest first, then
        by `position`) so a client can build the tree in one pass, with what the frontend needs to draw
        it: `source` (how to render it), `api_base` (which API to call), `mode`, and, for a `settings`
        leaf, its `settings` (each with a `render` hint and its options) or, for a `rule` leaf, its `rule`
        summary.'
      parameters:
      - name: enabled_only
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Only modules the program has switched on.
      - name: include_options
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Fill library-backed settings with their library's options. They come from memory
          in most cases; pass `false` to skip them entirely.
      responses:
        '200':
          $ref: '#/components/responses/ProgramModulesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-ignore-rules:
      - rule: aep-158-max-page-size-parameter
        reason: The manifest is one program's modules (about 70 rows at most) and is always returned whole;
          the frontend needs the complete tree to draw the page.
      - rule: aep-158-page-token-parameter
        reason: 'Same: never paginated.'
