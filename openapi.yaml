        website_id:
          type: string
          nullable: true
        discount:
          $ref: '#/components/schemas/DiscountConfig'
    UpdateStoreDiscountBody:
      type: object
      description: 'Request body: the change under `discount`. `path` is read-only and ignored on input.'
      x-aep-resource:
        patterns:
        - programs/{program}/store-discounts/{enrollment}
        singular: store-discount
