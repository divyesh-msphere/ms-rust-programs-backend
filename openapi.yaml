openapi: 3.0.3
info:
  title: Programs API
  description: |
    API for managing programs: the module tree, per-program settings sourced from global-settings libraries, GoRules rule sets, publications, enrollment, agreements and reports.
    This API follows AEP (API Enhancement Proposal) guidelines.

    All `date-time` fields are always UTC, formatted as `YYYY-MM-DDTHH:MM:SS[.ffffff]`, with no timezone offset or `Z` suffix.
  version: 0.1.0
  contact:
    name: API Support
    email: devops@mobilesentrix.com
  license:
    name: Proprietary
    url: https://mobilesentrix.com/terms
  termsOfService: https://mobilesentrix.com/terms
servers:
- url: http://localhost:8090
  description: Local (Swagger UI on :8082 needs APP__CORS_ALLOWED_ORIGIN=http://localhost:8082)
  x-name: local
- url: https://api.dev.mobilesentrix.com/programs
  description: Development environment
  x-name: development
security:
- cookieAuth: []
- bearerAuth: []
- clientIdHeader: []
  clientSecretHeader: []
x-ignore-rules:
- rule: aep-133-id-parameter
  reason: Health check is a liveness probe, not an AEP resource collection.
- rule: aep-132-operation-id
  reason: Health check is a liveness probe, not an AEP resource collection.
tags:
- name: health
  x-summary: Health
  description: Health check endpoint
- name: programs
  x-summary: Programs
  description: 'Programs: create, read, update, soft delete and undelete.'
- name: module-definitions
  x-summary: Module Definitions
  description: A node of the module tree (group or leaf). Seeded; the tree can nest to any depth.
- name: program-modules
  x-summary: Program Modules
  description: A program's module manifest.
- name: rule-sets
  x-summary: Rule Sets
  description: The GoRules decision graph of one family (pre_enrollment, discount, markup...) for a program.
    The id is the family.
- name: rule-versions
  x-summary: Rule Versions
  description: An immutable version of a rule set. Saving a draft is Create.
- name: publications
  x-summary: Publications
  description: A published, immutable bundle the pricing service loads. Create returns an operation.
- name: enrollments
  x-summary: Enrollments
  description: A store enrolled in a program. Created by the system when the last signoff is approved.
- name: document-folders
  x-summary: Document Folders
  description: A folder of program documents.
- name: documents
  x-summary: Documents
  description: A program document or manual.
- name: audit-logs
  x-summary: Audit Logs
  description: Who changed what, with before and after. Read-only; backs History and View changes.
- name: webhooks
  x-summary: Webhooks
  description: Events other services send to this one.
- name: field-values
  x-summary: Setting values
  description: What admins enter into the settings they defined.
- name: overview
  x-summary: Overview
  description: A program's default Overview page.
- name: store-discounts
  x-summary: Store Discounts
  description: 'The Store Discounts page: each enrolled store''s effective discount.'
- name: store-discount-levels
  x-summary: Store Discount Levels
  description: The program and website levels the store discounts inherit from.
paths:
  /health:
    x-info:
      health-endpoint: true
    get:
      operationId: ListHealthCheck
      summary: Health check
      tags:
      - health
      description: Returns service liveness status; used by uptime checks and load balancers.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
  /programs:
    get:
      operationId: ListPrograms
      summary: List programs
      tags:
      - programs
      description: Returns programs in creation order.
      parameters:
      - $ref: '#/components/parameters/maxPageSize'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/showDeleted'
      responses:
        '200':
          $ref: '#/components/responses/ProgramsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: CreateProgram
      summary: Create a program
      tags:
      - programs
      description: 'Creates a program, its module manifest AND whatever the admin made of each leaf (rule
        or settings) in ONE transaction: the program, the picked modules with their ancestors, the default
        Overview module and its counters row, each leaf''s mode and settings, the audit entry and the
        outbox event. Global-settings libraries are checked before the transaction opens. The response
        carries the manifest.'
      parameters:
      - $ref: '#/components/parameters/clientId'
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - slug
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                slug:
                  type: string
                  pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                  maxLength: 64
                description:
                  type: string
                level:
                  type: string
                  enum:
                  - user
                  - organization
                  - location
                  default: location
                modules:
                  type: array
                  maxItems: 200
                  items:
                    oneOf:
                    - type: string
                    - $ref: '#/components/schemas/ModuleConfig'
                  description: 'The modules the admin picked: a plain key, or an object with the key plus
                    what they made of the leaf (`mode`, `settings`). Ancestors, the descendants of a picked
                    group and the default Overview are added automatically. Unknown or non-selectable
                    keys, an invalid setting, or a library that does not exist return 422; nothing is
                    saved in that case.'
              x-aep-resource:
                singular: program
                plural: programs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramWithModules'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A live program with this slug already exists.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    get:
      operationId: GetProgram
      summary: Get a program
      tags:
      - programs
      description: Returns a single program by ID or slug.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: UpdateProgram
      summary: Update a program
      tags:
      - programs
      description: 'Partially updates a program. `slug` is immutable: it is ignored if sent. Changing
        `level`, `active` or any module, mode or setting bumps `config_version`; changing only `name`
        or `description` does not. `modules` applies module changes in ONE transaction: a new key adds
        the module (with its ancestors), `mode` sets what a leaf is, `settings` replaces that module''s
        settings, `enabled: false` switches a module off. The response includes the module manifest when
        `modules` was sent. Send `description: null` to clear it.'
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              x-aep-resource:
                singular: program
                plural: programs
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                description:
                  type: string
                  nullable: true
                level:
                  type: string
                  enum:
                  - user
                  - organization
                  - location
                active:
                  type: boolean
                modules:
                  type: array
                  maxItems: 200
                  items:
                    oneOf:
                    - type: string
                    - $ref: '#/components/schemas/ModuleConfig'
                  description: 'Module changes. A new key adds the module; `mode` sets what a leaf is;
                    `settings` REPLACES that module''s settings; `enabled: false` switches it off. Absent
                    touches no module.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramWithModules'
        '400':
          description: 'The body is malformed (the message names the field), or the change is not allowed
            in the current state: a leaf that still has settings or a rule with versions cannot change
            mode, and a setting with saved values cannot change type.'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: DeleteProgram
      summary: Delete a program
      tags:
      - programs
      description: Soft-deletes the program (state DELETED); reversible with `:undelete`. Its slug becomes
        free to reuse.
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      responses:
        '204':
          $ref: '#/components/responses/EmptyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}:undelete:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    post:
      operationId: :UndeleteProgram
      summary: Undelete a program
      tags:
      - programs
      description: Reverses a soft delete (AEP-164). Fails with 400 if the program is not deleted, and
        409 if another live program now uses its slug.
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: No fields required; this custom method takes no input.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another live program already uses this program's slug.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /module-definitions:
    get:
      operationId: ListModuleDefinitions
      summary: List module definitions
      tags:
      - module-definitions
      description: Returns the direct children of `parent_id`, or the root-level (main) modules when it
        is omitted, in display order. Pass `full_tree=true` to get the whole tree in one response instead,
        nested under `children`; combined with `parent_id` it returns everything beneath that module.
      parameters:
      - name: parent_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: List the direct children of this module. Omitted returns the root-level (main) modules.
      - $ref: '#/components/parameters/maxPageSize'
      - $ref: '#/components/parameters/pageToken'
      - name: full_tree
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, ignores `max_page_size` / `page_token` and returns the whole tree (or,
          with `parent_id`, the subtree beneath that module) as nested `children`, in a single response.
      responses:
        '200':
          $ref: '#/components/responses/ModuleDefinitionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
  /module-definitions/{module_definition}:
    parameters:
    - name: module_definition
      in: path
      required: true
      schema:
        type: string
      description: The module definition's ID, or its key (e.g. `catalog_pricing`).
    get:
      operationId: GetModuleDefinition
      summary: Get a module definition
      tags:
      - module-definitions
      description: Returns a single module definition by ID or by key.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}/modules:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    get:
      operationId: ListProgramModules
      summary: List a program's modules (the manifest)
      tags:
      - program-modules
      description: 'Every module the program has chosen, ordered parents-first (shallowest first, then
        by `position`) so a client can build the tree in one pass, with what the frontend needs to draw
        it: `source` (how to render it), `api_base` (which API to call), `mode`, and, for a `settings`
        leaf, its `settings` (each with a `render` hint and its options) or, for a `rule` leaf, its `rule`
        summary.'
      parameters:
      - name: enabled_only
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Only modules the program has switched on.
      - name: include_options
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Fill library-backed settings with their library's options. They come from memory
          in most cases; pass `false` to skip them entirely.
      responses:
        '200':
          $ref: '#/components/responses/ProgramModulesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-ignore-rules:
      - rule: aep-158-max-page-size-parameter
        reason: The manifest is one program's modules (about 70 rows at most) and is always returned whole;
          the frontend needs the complete tree to draw the page.
      - rule: aep-158-page-token-parameter
        reason: 'Same: never paginated.'
  /programs/{program}/audit-logs:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    get:
      operationId: ListAuditLogs
      summary: List a program's audit log
      tags:
      - audit-logs
      description: 'The program''s history, newest first: who changed what and when, with the before and
        after of each change (the History and View changes buttons). Paged by time, so a deep page costs
        the same as the first.'
      parameters:
      - $ref: '#/components/parameters/maxPageSize'
      - $ref: '#/components/parameters/pageToken'
      - name: action
        in: query
        required: false
        schema:
          type: string
        example: values_updated,updated
        description: Only these actions, comma-separated. Omit for all.
      responses:
        '200':
          $ref: '#/components/responses/AuditLogsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}/field-values:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    get:
      operationId: ListFieldValues
      summary: List a program's saved setting values
      tags:
      - field-values
      description: The saved values of the program's settings, with the `config_version` to send back
        on a save. Settings that have no value yet are not listed (the manifest shows every setting, each
        with its value).
      parameters:
      - name: module
        in: query
        required: false
        schema:
          type: string
        description: Only one module's values (its key).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFieldValuesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-ignore-rules:
      - rule: aep-158-max-page-size-parameter
        reason: One program's saved values (at most a few dozen settings) are always returned whole; they
          are not a paginated collection.
      - rule: aep-158-page-token-parameter
        reason: 'Same: never paginated.'
  /programs/{program}/field-values:batchUpdate:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    post:
      operationId: :BatchUpdateFieldValues
      summary: Save setting values
      tags:
      - field-values
      description: |-
        Saves everything changed on a page ("N unsaved changes" -> Save) in ONE request and ONE transaction. Each value is checked against its setting: a boolean must be true or false, a number a number, text text; a radio or dropdown takes one option, a checkbox a list; every chosen option must be one of the setting's own active options or, for a library-backed setting, one of its library's active options (read through the cache); a required setting cannot be cleared. ALL the problems are reported together and nothing is saved if any value is wrong.

        Only values that differ are written. Saving nothing new changes nothing, bumps nothing and shows no "unpublished changes". A change bumps the program's `config_version` and writes an audit entry (with before and after) and an outbox event.

        `version` is the `config_version` you last read: if the program changed since, the save is rejected with 409 and nothing is written. Omit it to skip the check (last write wins).
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - values
              properties:
                version:
                  type: integer
                  format: int32
                values:
                  type: object
                  maxProperties: 200
                  additionalProperties:
                    $ref: '#/components/schemas/FieldValuePatch'
                  description: The changed values, keyed by setting id. A value of `null` clears that
                    setting.
                  example:
                    01a143f1-c42e-73c8-8046-a168ed0886ff:
                      value: true
                    01a143f1-c42e-73c8-8046-a168ed0886aa:
                      option_ids:
                      - d600279b-b182-4012-ac5a-e4b1063a7cd4
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUpdateFieldValuesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}/overview:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    get:
      operationId: GetOverview
      summary: Get a program's Overview
      tags:
      - overview
      description: 'The default page every program has: the program summary, the counters, the enrollment
        funnel, the published-rules sync state (and whether there are unpublished changes), and the latest
        activity. Read in one database round trip.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-ignore-rules:
      - rule: aep-132-operation-id
        reason: A singleton page, not a list.
      - rule: aep-158-max-page-size-parameter
        reason: A singleton, not paginated.
      - rule: aep-158-page-token-parameter
        reason: A singleton, not paginated.
  /programs/{program}/enrollments:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    get:
      operationId: ListEnrollments
      summary: List a program's enrolled stores
      tags:
      - enrollments
      description: 'The Enrolled Stores page: newest first, paged by id. Filters combine: `website_id`
        (All websites), `status` chips (comma-separated), `store` (name prefix, case-insensitive). `total_size`
        is the "N STORES" count for the active filters. One table, no joins.'
      parameters:
      - $ref: '#/components/parameters/maxPageSize'
      - $ref: '#/components/parameters/pageToken'
      - name: website_id
        in: query
        required: false
        schema:
          type: string
        description: Only this website.
      - name: status
        in: query
        required: false
        schema:
          type: string
        example: active,suspended
        description: 'Only these statuses, comma-separated: pending, active, suspended, ended. Omit for
          all.'
      - name: store
        in: query
        required: false
        schema:
          type: string
        description: A prefix of the store name.
      responses:
        '200':
          $ref: '#/components/responses/EnrollmentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: CreateEnrollment
      summary: Enroll a store
      tags:
      - enrollments
      description: An admin enrolls a store directly, without an application. `status` is `active` (default)
        or `pending`. A store with a live enrollment on the website gets 409; after `ended` it can be
        enrolled again. Without `store_name` the store shows as unresolved. The Overview counters (`active_enrollments`,
        `enrollments_total`) move in the same transaction, together with an audit entry and an outbox
        event.
      parameters:
      - $ref: '#/components/parameters/clientId'
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Enrollment'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}/enrollments:batchCreate:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    post:
      operationId: :BatchCreateEnrollments
      summary: Bulk enroll stores
      tags:
      - enrollments
      description: 'Enrolls up to 500 stores with one statement. Every item gets its own outcome, in the
        order sent: `created`, `already_enrolled` (live enrollment exists, or the store is listed twice)
        or `failed` (invalid item). One bad or duplicate item never fails the rest. One audit entry and
        one outbox event cover the whole batch. The Overview counters (`active_enrollments`, `enrollments_total`)
        move in the same transaction, together with an audit entry and an outbox event.'
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required:
                    - store_id
                    - website_id
                    properties:
                      store_id:
                        type: string
                      store_name:
                        type: string
                      website_id:
                        type: string
                      website_name:
                        type: string
                      customer_group:
                        type: string
                      status:
                        type: string
                        enum:
                        - pending
                        - active
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateEnrollmentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}/enrollments/{enrollment}:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
