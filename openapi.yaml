    post:
      operationId: CreatePublication
      summary: Publish the program
      tags:
      - publications
      description: |-
        Publishes the program's configuration, in one transaction under the program lock so the snapshot is consistent: every rule leaf's newest draft becomes its published version (the previous one is superseded), the bundle is built (modules with settings and values, requirements, approval steps, the store -> discount map of active stores, the published rules) and stored, and an audit entry and outbox event are written. The Overview then reads "in sync". The answer carries the `summary`, not the bundle: read it with GET.

        400 when there is nothing new to publish (the program has not changed since the last publication), or when a rule's newest draft is invalid (naming the rules). It does not change `config_version`.
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
