          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        before:
          type: object
          additionalProperties: true
          nullable: true
        after:
          type: object
          additionalProperties: true
          nullable: true
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true
    ProgramModuleField:
      type: object
      description: A field of a field-driven module with its current value.
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
          - toggle
          - select
          - multi_select
          - text
          - number
          - derived
        value:
          type: object
          additionalProperties: true
          nullable: true
        selected:
          type: array
          items:
            type: string
            format: uuid
          description: Selected library option ids.
        options:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 'Present only with `include_options=true`. Removed options appear as `{id, deleted:
            true}`.'
        visible:
          type: boolean
        source:
          type: string
          nullable: true
    FieldValue:
      type: object
      description: A new value for one field. Use `option_ids` for library picks, `value` otherwise.
      properties:
        value:
          type: object
          additionalProperties: true
          nullable: true
        option_ids:
          type: array
          items:
            type: string
            format: uuid
    SimulateRuleSetRequest:
      type: object
      required:
      - jdm
      - input
      properties:
        jdm:
          type: object
          additionalProperties: true
          description: Current editor content.
        input:
          type: object
          additionalProperties: true
    SimulateRuleSetResponse:
      type: object
      properties:
        output:
          type: object
          additionalProperties: true
        trace:
          type: object
          additionalProperties: true
    Operation:
      type: object
      description: AEP-151 long-running operation.
      x-aep-resource:
        patterns:
        - operations/{operation}
        singular: operation
        plural: operations
        type: msrestapi.com/programs/operation
      properties:
        path:
          type: string
          example: operations/9f3a
        id:
          type: string
          format: uuid
          readOnly: true
        done:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
        response:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
          example: 400
        message:
          type: string
          example: The request was invalid.
        detail:
          type: string
          example: INVALID_ARGUMENT
        details:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: field_violation
              field:
                type: string
                example: name
              description:
                type: string
                example: Name is required
    ResourceState:
      type: string
      readOnly: true
      enum:
      - STATE_UNSPECIFIED
      - ACTIVE
      - DELETED
      description: AEP-216 resource state, used per AEP-135 as the soft-delete marker. DELETED resources
        are excluded from Get/List by default and surfaced with show_deleted=true.
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          example: ok
    ModuleDefinitionTreeNode:
      description: A module with its descendants nested under `children` (`full_tree=true`). Carries every
        ModuleDefinition field.
      allOf:
      - $ref: '#/components/schemas/ModuleDefinition'
      type: object
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/ModuleDefinitionTreeNode'
    ProgramWithModules:
      type: object
      description: 'Create''s response: the program plus the module manifest it was created with.'
      x-aep-resource:
        patterns:
        - programs/{program}
        singular: program
        plural: programs
        type: msrestapi.com/programs/program
      required:
      - name
      - slug
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
          description: Lowercase letters, digits and single hyphens. Unique among non-deleted programs
            (case-insensitive). IMMUTABLE after create. `GET /programs/{program}` accepts it in place
            of the id.
        description:
          type: string
          nullable: true
        level:
          type: string
          enum:
          - user
          - organization
          - location
          default: location
          description: The customer-hierarchy grain the program is anchored at.
        active:
          type: boolean
        config_version:
          type: integer
          format: int32
          readOnly: true
          description: Bumped on every configuration change (level, active, and later settings); compared
            with the latest publication to detect drift.
        config_hash:
          type: string
          readOnly: true
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true
        state:
          $ref: '#/components/schemas/ResourceState'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ProgramModule'
    OptionConfig:
      type: object
      required:
      - label
      description: One of the admin's own options for a radio, checkbox or dropdown setting.
      properties:
        code:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]+$
          description: 'The option''s identity. Omitted means it is derived from the label. Options are
            matched by code on update: a code that is no longer listed is deactivated (not deleted), so
            saved values never lose their option.'
        label:
          type: string
          minLength: 1
          maxLength: 120
    SettingConfig:
      type: object
      required:
      - name
      - type
      description: One setting on a leaf whose mode is `settings`. The read-only fields a manifest returns
        (`key`, `render`, `position`, `options_source`, ...) are accepted and ignored, so a setting can
        be sent straight back after editing.
      properties:
        id:
          type: string
          format: uuid
          description: Present for an existing setting (kept and updated); absent for a new one.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Shown to the admin. The setting's `key` is generated from it and never changes.
        type:
          type: string
          enum:
          - boolean
          - number
          - text
          - radio
          - checkbox
          - dropdown
          description: 'Decides the control: boolean = Yes/No, number, text, radio, checkbox, dropdown.
            A type cannot change once the setting has saved values.'
        required:
          type: boolean
          default: false
        default:
          description: 'The starting value: a boolean, number, text, an option code (radio / dropdown),
            or a list of option codes (checkbox). Must match the type; for manual options it must be one
            of their codes.'
          nullable: true
        library_id:
          type: string
          format: uuid
          description: A global-settings library. For radio / checkbox / dropdown only. The library is
            then the ONLY source of the options (nothing is copied), and it must exist.
        options:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OptionConfig'
          description: 'The admin''s own options: the ONLY source when there is no `library_id`. Giving
            both a library and options is rejected. Radio, checkbox and dropdown need one of the two;
            boolean, number and text take neither.'
    ModuleConfig:
      type: object
      required:
      - key
      additionalProperties: false
      description: A module the admin picked, with what they made of it. An unknown property (for example
        `setting` instead of `settings`) is rejected by name.
      properties:
        key:
          type: string
          example: catalog_pricing.products_rules.warranty
        enabled:
          type: boolean
          description: '`false` switches the module off; its data is kept.'
        mode:
          type: string
          enum:
          - rule
          - settings
          description: 'What the admin makes this leaf: `rule` (the leaf IS the rule engine, which the
            frontend renders) or `settings`. Only on a configurable module (`allow_components`); a premade
            module can only be `settings`. Cannot change while the leaf still has settings or a rule with
            versions.'
        settings:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SettingConfig'
          description: 'Needs `mode: settings`. REPLACES the module''s settings: items with an `id` are
            kept and updated, items without one are created, and the rest are removed (their saved values
            survive). Omit to leave the settings alone; send `[]` to remove them all.'
    SettingOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Ours for a manual option, the library's for a library option.
        code:
          type: string
        label:
          type: string
        source:
          type: string
          enum:
          - manual
          - library
        active:
          type: boolean
    ProgramSetting:
      type: object
      description: One setting of a `settings` leaf, with what the frontend needs to draw it.
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - boolean
          - number
          - text
          - radio
          - checkbox
          - dropdown
        render:
          type: string
          enum:
          - yes_no
          - number_input
          - text_input
          - radio_group
          - checkbox_group
          - dropdown
          description: The control to draw.
        required:
          type: boolean
        default:
          nullable: true
        position:
          type: integer
          format: int32
        options_source:
          type: string
          enum:
          - manual
          - library
          nullable: true
          description: For radio / checkbox / dropdown; null for the other types.
        library_id:
          type: string
          format: uuid
          nullable: true
        options:
          type: array
          items:
            $ref: '#/components/schemas/SettingOption'
          description: Manual options from our database, or the library's active options read live from
            global-settings (served from memory, refreshed in the background and cleared the moment global-settings
            reports a change). Empty for boolean / number / text.
        library_error:
          type: string
          enum:
          - not_found
          - unavailable
          nullable: true
          description: Set when the library's options could not be read; the rest of the page still loads.
    ProgramRule:
      type: object
      description: 'A rule leaf''s rule-set summary. The rule engine itself is a front-end component;
        `mode: rule` is what tells the frontend to render it.'
      properties:
        rule_type:
          type: string
          nullable: true
        draft_version:
          type: integer
          format: int32
          nullable: true
        published_version:
          type: integer
          format: int32
          nullable: true
