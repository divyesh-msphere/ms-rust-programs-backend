    - name: operation
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the operation.
    get:
      operationId: GetOperation
      summary: Get an operation
      tags:
      - operations
      description: Returns a single long-running operation, including `done`, `response` and `error`.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /webhooks/global-settings:
    post:
      operationId: ReceiveGlobalSettingsEvent
      summary: Receive a global-settings change event
      tags:
      - webhooks
      description: Called by global-settings when a library, one of its attributes, or one of its options
        changes (`lib.*` events). What is cached of the libraries is dropped and re-read, so a new or
        renamed option shows up on the very next read. Events global-settings does not send for libraries
        without `event_enabled`. Any other event type is accepted and ignored. When a webhook secret is
        configured, the `X-Webhook-Secret` header must carry it.
      x-ignore-rules:
      - rule: aep-133-id-parameter
        reason: An internal event receiver, not an AEP resource.
      parameters:
      - name: X-Webhook-Secret
        in: header
        required: false
        schema:
          type: string
        description: Required only when a webhook secret is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - event_type
              properties:
                event_id:
                  type: string
                event_type:
                  type: string
                  example: lib.option.created
                event_payload:
                  type: object
                  additionalProperties: true
      responses:
        '204':
          $ref: '#/components/responses/EmptyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or wrong `X-Webhook-Secret`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-ms_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your bearer token in the format **Bearer token**
    clientIdHeader:
      type: apiKey
      in: header
      name: X-Client-ID
      description: Client ID for service-to-service authentication
    clientSecretHeader:
      type: apiKey
      in: header
      name: X-Client-Secret
      description: Client secret for service-to-service authentication
  parameters:
    clientId:
      name: id
      in: query
      required: false
      schema:
        type: string
      description: Optional client-specified ID for the resource being created (AEP-133). Must be a valid
        UUID; the server generates one if omitted.
    pageToken:
      name: page_token
      in: query
      required: false
      schema:
        type: string
      description: The next_page_token value returned from a previous list request.
    maxPageSize:
      name: max_page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
      description: The maximum number of items to return per page.
    filter:
      name: filter
      in: query
      required: false
      schema:
        type: string
      description: 'Optional single-clause equality filter: "<field> == ''<value>''". Text comparisons
        are a case-insensitive substring match. Omit to return the unfiltered list.'
    orderBy:
      name: order_by
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated list of fields to order by, each optionally followed by `desc` (AEP-132).
    showDeleted:
      name: show_deleted
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: AEP-135 soft-delete flag. When false (default) only active resources are returned;
