  /programs/{program}/store-discounts:batchUpdate:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    post:
      operationId: :BatchUpdateStoreDiscounts
      summary: Mass edit store discounts
      tags:
      - store-discounts
      description: 'The same change for up to 500 ticked stores, with one write statement, ONE version
        bump, ONE audit entry and ONE outbox event whatever the number. Every id must be an enrolled store
        of the program (404 otherwise) and the whole batch is refused (422, naming the store) if any store
        would end up invalid, for example a percentage over 100. `discount: null` reverts every ticked
        store to the inherited values. The program must have the Store Discounts Control Panel module
        switched on (400 otherwise). It is a configuration change: it bumps `config_version` (the module
        requires publish, so the Overview shows "unpublished changes"), writes an audit entry and an outbox
        event, in one transaction. A request that changes nothing writes nothing.'
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - discount
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                    format: uuid
                  description: The enrollment ids.
                discount:
                  nullable: true
                  allOf:
                  - $ref: '#/components/schemas/DiscountPatch'
                  description: The change, or `null` to revert everything to the inherited values. The
                    key itself is required.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStoreDiscountsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
