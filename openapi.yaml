          - $ref: '#/components/schemas/DiscountPatch'
          description: The change, or `null` to revert everything to the inherited values. The key itself
            is required.
      required:
      - discount
    RuleVersion:
      type: object
      description: An immutable, numbered save of a rule set. The newest is the `draft`; publishing makes
        it `published`; the one it replaces becomes `superseded`. A published version is never changed.
      x-aep-resource:
        patterns:
        - programs/{program}/rule-sets/{rule_set}/versions/{version}
        singular: rule-version
        plural: rule-versions
        type: msrestapi.com/programs/rule-version
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          format: int32
          readOnly: true
        status:
          type: string
          enum:
          - draft
          - published
          - superseded
          readOnly: true
        definition:
          type: object
          additionalProperties: true
          description: The rule model the builder draws (up to 1 MB). The backend keeps it as it is; the
            rule engine owns its shape. On create, and on a single read only.
        compiled:
          type: object
          additionalProperties: true
          nullable: true
          description: The decision graph the rule engine generated, when it did (up to 1 MB). On create,
            and on a single read only.
        rule_type:
          type: string
          writeOnly: true
          description: Informational; defaults from the module's rule family. Only used when the rule
            set is first created.
        valid:
          type: boolean
          description: Whether the rule engine found the definition complete. Defaults to "no validation
            errors were sent". An invalid draft blocks publishing.
        validation_errors:
          type: array
          maxItems: 100
          items: {}
          description: The rule engine's complaints. A version with errors cannot be valid.
        content_hash:
          type: string
          readOnly: true
          description: 'Hash of the definition: saving the same definition again creates no new version.'
        size_bytes:
          type: integer
          format: int32
          readOnly: true
        created_by:
          type: string
          nullable: true
          readOnly: true
        create_time:
          type: string
          format: date-time
          readOnly: true
        created:
          type: boolean
          readOnly: true
          description: 'Only in the answer to a save: `false` when the save changed nothing, so no new
            version was made and this is the newest one.'
      required:
      - definition
    RuleSet:
      type: object
      description: The rules of one Rule leaf (a module whose mode is `rule`), addressed by its module
        key. The rule engine is a frontend component; the backend versions what it saves and publishes
        it.
      x-aep-resource:
        patterns:
        - programs/{program}/rule-sets/{rule_set}
        singular: rule-set
        plural: rule-sets
        type: msrestapi.com/programs/rule-set
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        module_key:
          type: string
          readOnly: true
          example: catalog_pricing.products_rules.warranty
        module_name:
          type: string
          readOnly: true
        rule_type:
          type: string
          nullable: true
          readOnly: true
        draft_version:
          type: integer
          format: int32
          nullable: true
          readOnly: true
        published_version:
          type: integer
          format: int32
          nullable: true
          readOnly: true
        state:
          type: string
          enum:
          - empty
          - never
          - drifted
          - in_sync
          readOnly: true
          description: '`empty`: no rules saved yet (nothing to publish, not drift). `never`: saved but
            never published. `drifted`: a newer draft than what is live. `in_sync`.'
        draft:
          allOf:
          - $ref: '#/components/schemas/RuleVersion'
          readOnly: true
          description: The newest version with its definition. On a single read only.
        update_time:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    Publication:
      type: object
      description: 'A published, immutable snapshot of a program''s configuration: the modules with their
        settings and values, the requirements, the approval steps, the store -> discount map and the published
        rule versions. Append-only; the newest is what is live.'
      x-aep-resource:
        patterns:
        - programs/{program}/publications/{publication}
        singular: publication
        plural: publications
        type: msrestapi.com/programs/publication
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        config_version:
          type: integer
          format: int32
          readOnly: true
          description: The program's `config_version` this publication covers.
        config_hash:
          type: string
          readOnly: true
        summary:
          type: object
          additionalProperties: true
          readOnly: true
          description: Counts of what the bundle holds (`modules`, `requirements`, `approval_steps`, `store_discount_stores`)
            and the `rules` it carries as `{module_key, version}`.
        bundle:
          type: object
          additionalProperties: true
          readOnly: true
          description: The whole bundle. On a single read only.
        created_by:
          type: string
          nullable: true
          readOnly: true
        create_time:
          type: string
          format: date-time
          readOnly: true
    DocumentFolder:
      type: object
      description: A folder of the Documents page. Every program has four system folders (General, Import
        artifacts, Program Documents, Store Enrollment Documents) that cannot be renamed or deleted.
      x-aep-resource:
        patterns:
        - programs/{program}/document-folders/{folder}
        singular: document-folder
        plural: document-folders
        type: msrestapi.com/programs/document-folder
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: No slashes. Unique among the folders of the same parent, ignoring case.
        key:
          type: string
          nullable: true
          readOnly: true
          description: '`general`, `import_artifacts`, `program_documents` or `store_enrollment_documents`
            for a system folder; `null` for a custom folder.'
        system:
          type: boolean
          readOnly: true
        document_count:
          type: integer
          format: int32
          readOnly: true
          description: 'Files in this folder: a counter kept in the same transaction as every upload,
            move and delete.'
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - name
    Document:
      type: object
      description: One file's metadata. The bytes live in object storage and travel only between the browser
        and the storage through presigned URLs.
      x-aep-resource:
        patterns:
        - programs/{program}/documents/{document}
        singular: document
        plural: documents
        type: msrestapi.com/programs/document
      properties:
        path:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 'A label only: slashes and control characters become `_`. The storage key is generated
            by the server.'
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: 'On create: defaults to the General folder. On update: moves the file.'
        content_type:
          type: string
          example: application/pdf
          description: One of the allowed types (pdf, png, jpeg, docx, xlsx, csv, plain text by default).
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: The declared size (at most 25 MB by default). The storage refuses an upload of
            another size.
        status:
          type: string
          enum:
          - uploading
          - pending_scan
          - ok
          - needs_review
          - quarantined
          readOnly: true
          description: '`uploading` (hidden from every list) -> `pending_scan` -> `ok`, `needs_review`
            or `quarantined`. Nothing is `ok` until scanned.'
        source_type:
          type: string
          nullable: true
          readOnly: true
        source_id:
          type: string
          nullable: true
          readOnly: true
        uploaded_by:
          type: string
          nullable: true
          readOnly: true
        checksum:
          type: string
          nullable: true
          pattern: ^[0-9a-fA-F]{64}$
          description: SHA-256 in hex. When given on create, the storage itself refuses an upload that
            differs.
        scan_time:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        review_note:
          type: string
          nullable: true
          readOnly: true
        reviewed_by:
          type: string
          nullable: true
          readOnly: true
        reviewed_time:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - name
      - content_type
      - size_bytes
    StorageRequest:
      type: object
      description: A request the BROWSER makes straight to the object storage. The file bytes never pass
        through this service.
      properties:
        url:
          type: string
        method:
          type: string
          enum:
          - PUT
          - GET
        headers:
          type: object
          additionalProperties:
            type: string
          description: 'Send these headers exactly as given: they are part of the signature, so another
            type, size or checksum is refused by the storage.'
        expires_time:
          type: string
          format: date-time
    CreateDocumentResponse:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/Document'
        upload:
          $ref: '#/components/schemas/StorageRequest'
    DownloadDocumentResponse:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/Document'
        download:
          $ref: '#/components/schemas/StorageRequest'
    DocumentSummary:
      type: object
      description: The header, the left panel and the footer of the page, in one read.
      properties:
        files:
          type: integer
          format: int32
        bytes:
          type: integer
          format: int64
          description: The Storage line in the footer.
        locations:
          type: object
          properties:
            all:
              type: integer
            recent:
              type: integer
            needs_review:
              type: integer
            quarantined:
              type: integer
        folders:
          type: array
          items:
            $ref: '#/components/schemas/DocumentFolder'
          description: System folders first, with their counts.
    DocumentScanEvent:
      type: object
      required:
      - document_id
      - result
      properties:
        document_id:
          type: string
          format: uuid
        result:
          type: string
          enum:
          - clean
          - suspicious
          - infected
        scanner:
          type: string
