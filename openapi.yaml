openapi: 3.0.3
info:
  title: Programs API
  description: |
    API for managing programs: the module tree, per-program settings sourced from global-settings libraries, GoRules rule sets, publications, enrollment, agreements and reports.
    This API follows AEP (API Enhancement Proposal) guidelines.

    All `date-time` fields are always UTC, formatted as `YYYY-MM-DDTHH:MM:SS[.ffffff]`, with no timezone offset or `Z` suffix.
  version: 0.1.0
  contact:
    name: API Support
    email: devops@mobilesentrix.com
  license:
    name: Proprietary
    url: https://mobilesentrix.com/terms
  termsOfService: https://mobilesentrix.com/terms
servers:
- url: http://localhost:8090
  description: Local (Swagger UI on :8082 needs APP__CORS_ALLOWED_ORIGIN=http://localhost:8082)
  x-name: local
- url: https://api.dev.mobilesentrix.com/programs
  description: Development environment
  x-name: development
security:
- cookieAuth: []
- bearerAuth: []
- clientIdHeader: []
  clientSecretHeader: []
x-ignore-rules:
- rule: aep-133-id-parameter
  reason: Health check is a liveness probe, not an AEP resource collection.
- rule: aep-132-operation-id
  reason: Health check is a liveness probe, not an AEP resource collection.
tags:
- name: health
  x-summary: Health
  description: Health check endpoint
- name: programs
  x-summary: Programs
  description: 'Programs: create, read, update, soft delete and undelete.'
- name: blueprints
  x-summary: Blueprints
  description: Starting point for the create-program wizard. Its modules and default config are copied
    into the program at creation.
- name: module-definitions
  x-summary: Module Definitions
  description: A node of the module tree (group or leaf). Seeded; the tree can nest to any depth.
- name: module-fields
  x-summary: Module Fields
  description: A field rendered on a field_form leaf.
- name: blueprint-modules
  x-summary: Blueprint Modules
  description: A module a blueprint includes, with its default config.
- name: program-modules
  x-summary: Program Modules
  description: A program's module manifest.
- name: module-records
  x-summary: Module Records
  description: A row in a small list owned by a module (3PL fees, grade mapping, upsell products).
- name: program-overrides
  x-summary: Program Overrides
  description: Domain- or store-level config. Precedence is program < domain < store.
- name: program-domains
  x-summary: Program Domains
  description: A website a program applies to, with its customer group.
- name: rule-sets
  x-summary: Rule Sets
  description: The GoRules decision graph of one family (pre_enrollment, discount, markup...) for a program.
    The id is the family.
- name: rule-versions
  x-summary: Rule Versions
  description: An immutable version of a rule set. Saving a draft is Create.
- name: publications
  x-summary: Publications
  description: A published, immutable bundle the pricing service loads. Create returns an operation.
- name: requirements
  x-summary: Requirements
  description: An enrollment requirement.
- name: approval-steps
  x-summary: Approval Steps
  description: A step of the application approval chain.
- name: applications
  x-summary: Applications
  description: A store's application to enroll in a program.
- name: signoffs
  x-summary: Signoffs
  description: One approver's decision on one approval step.
- name: enrollments
  x-summary: Enrollments
  description: A store enrolled in a program. Created by the system when the last signoff is approved.
- name: agreement-templates
  x-summary: Agreement Templates
  description: A reusable agreement template; its text lives in immutable versions.
- name: agreement-template-versions
  x-summary: Agreement Template Versions
  description: An immutable version of an agreement template.
- name: agreement-contracts
  x-summary: Agreement Contracts
  description: An agreement pinned to a specific template version.
- name: document-folders
  x-summary: Document Folders
  description: A folder of program documents.
- name: documents
  x-summary: Documents
  description: A program document or manual.
- name: import-jobs
  x-summary: Import Jobs
  description: A bulk import. Create returns an operation.
- name: import-job-rows
  x-summary: Import Job Rows
  description: One row of an import job.
- name: sku-prices
  x-summary: Sku Prices
  description: A program-specific SKU price.
- name: core-return-fees
  x-summary: Core Return Fees
  description: A core return fee.
- name: report-definitions
  x-summary: Report Definitions
  description: A report that can be run for a program.
- name: report-runs
  x-summary: Report Runs
  description: One execution of a report. Create returns an operation.
- name: audit-logs
  x-summary: Audit Logs
  description: Who changed what, with before and after. Read-only; backs History and View changes.
- name: operations
  x-summary: Operations
  description: Long-running operations (publish, imports, report runs)
- name: webhooks
  x-summary: Webhooks
  description: Events other services send to this one.
paths:
  /health:
    x-info:
      health-endpoint: true
    get:
      operationId: ListHealthCheck
      summary: Health check
      tags:
      - health
      description: Returns service liveness status; used by uptime checks and load balancers.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
  /programs:
    get:
      operationId: ListPrograms
      summary: List programs
      tags:
      - programs
      description: Returns programs in creation order.
      parameters:
      - $ref: '#/components/parameters/maxPageSize'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/showDeleted'
      responses:
        '200':
          $ref: '#/components/responses/ProgramsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: CreateProgram
      summary: Create a program
      tags:
      - programs
      description: 'Creates a program, its module manifest AND whatever the admin made of each leaf (rule
        or settings) in ONE transaction: the program, the picked modules with their ancestors, the default
        Overview module and its counters row, each leaf''s mode and settings, the audit entry and the
        outbox event. Global-settings libraries are checked before the transaction opens. The response
        carries the manifest.'
      parameters:
      - $ref: '#/components/parameters/clientId'
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - slug
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                slug:
                  type: string
                  pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                  maxLength: 64
                description:
                  type: string
                level:
                  type: string
                  enum:
                  - user
                  - organization
                  - location
                  default: location
                modules:
                  type: array
                  maxItems: 200
                  items:
                    oneOf:
                    - type: string
                    - $ref: '#/components/schemas/ModuleConfig'
                  description: 'The modules the admin picked: a plain key, or an object with the key plus
                    what they made of the leaf (`mode`, `settings`). Ancestors, the descendants of a picked
                    group and the default Overview are added automatically. Unknown or non-selectable
                    keys, an invalid setting, or a library that does not exist return 422; nothing is
                    saved in that case.'
              x-aep-resource:
                singular: program
                plural: programs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramWithModules'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A live program with this slug already exists.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    get:
      operationId: GetProgram
      summary: Get a program
      tags:
      - programs
      description: Returns a single program by ID or slug.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: UpdateProgram
      summary: Update a program
      tags:
      - programs
      description: 'Partially updates a program. `slug` is immutable: it is ignored if sent. Changing
        `level`, `active` or any module, mode or setting bumps `config_version`; changing only `name`
        or `description` does not. `modules` applies module changes in ONE transaction: a new key adds
        the module (with its ancestors), `mode` sets what a leaf is, `settings` replaces that module''s
        settings, `enabled: false` switches a module off. The response includes the module manifest when
        `modules` was sent. Send `description: null` to clear it.'
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              x-aep-resource:
                singular: program
                plural: programs
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                description:
                  type: string
                  nullable: true
                level:
                  type: string
                  enum:
                  - user
                  - organization
                  - location
                active:
                  type: boolean
                modules:
                  type: array
                  maxItems: 200
                  items:
                    oneOf:
                    - type: string
                    - $ref: '#/components/schemas/ModuleConfig'
                  description: 'Module changes. A new key adds the module; `mode` sets what a leaf is;
                    `settings` REPLACES that module''s settings; `enabled: false` switches it off. Absent
                    touches no module.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramWithModules'
        '400':
          description: 'The body is malformed (the message names the field), or the change is not allowed
            in the current state: a leaf that still has settings or a rule with versions cannot change
            mode, and a setting with saved values cannot change type.'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: DeleteProgram
      summary: Delete a program
      tags:
      - programs
      description: Soft-deletes the program (state DELETED); reversible with `:undelete`. Its slug becomes
        free to reuse.
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      responses:
        '204':
          $ref: '#/components/responses/EmptyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{program}:undelete:
    parameters:
    - name: program
      in: path
      required: true
      schema:
        type: string
      description: The program's ID (UUID) or its slug.
    post:
      operationId: :UndeleteProgram
      summary: Undelete a program
      tags:
      - programs
      description: Reverses a soft delete (AEP-164). Fails with 400 if the program is not deleted, and
        409 if another live program now uses its slug.
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
        description: The authenticated user, forwarded by the gateway. Recorded as the actor in the audit
          log; `system` when absent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: No fields required; this custom method takes no input.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another live program already uses this program's slug.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /blueprints:
    get:
      operationId: ListBlueprints
      summary: List blueprints
      tags:
      - blueprints
      description: Returns blueprints.
      parameters:
      - $ref: '#/components/parameters/maxPageSize'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/orderBy'
      - $ref: '#/components/parameters/showDeleted'
      responses:
        '200':
          $ref: '#/components/responses/BlueprintsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: CreateBlueprint
      summary: Create a blueprint
      tags:
      - blueprints
      description: Creates a blueprint.
      parameters:
      - $ref: '#/components/parameters/clientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blueprint'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blueprint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A resource with the same unique key already exists.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /blueprints/{blueprint}:
    parameters:
    - name: blueprint
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the blueprint.
    get:
      operationId: GetBlueprint
      summary: Get a blueprint
      tags:
      - blueprints
      description: Returns a single blueprint.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blueprint'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: UpdateBlueprint
      summary: Update a blueprint
      tags:
      - blueprints
      description: Partially updates a blueprint. Fields not sent are left unchanged.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              x-aep-resource:
                singular: blueprint
                plural: blueprints
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                active:
                  type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blueprint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict or unique-key collision.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: DeleteBlueprint
      summary: Delete a blueprint
      tags:
      - blueprints
      description: Soft-deletes (AEP-135); reversible with `:undelete`.
      responses:
        '204':
          $ref: '#/components/responses/EmptyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /blueprints/{blueprint}:undelete:
    parameters:
    - name: blueprint
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the blueprint.
    post:
      operationId: :UndeleteBlueprint
      summary: Undelete a blueprint
      tags:
      - blueprints
      description: Undelete a blueprint (AEP-136 custom method).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: No fields required; this custom method takes no input.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blueprint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /module-definitions:
    get:
      operationId: ListModuleDefinitions
      summary: List module definitions
      tags:
      - module-definitions
      description: Returns the direct children of `parent_id`, or the root-level (main) modules when it
        is omitted, in display order. Pass `full_tree=true` to get the whole tree in one response instead,
        nested under `children`; combined with `parent_id` it returns everything beneath that module.
      parameters:
      - name: parent_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: List the direct children of this module. Omitted returns the root-level (main) modules.
      - $ref: '#/components/parameters/maxPageSize'
      - $ref: '#/components/parameters/pageToken'
      - name: full_tree
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, ignores `max_page_size` / `page_token` and returns the whole tree (or,
          with `parent_id`, the subtree beneath that module) as nested `children`, in a single response.
      responses:
        '200':
          $ref: '#/components/responses/ModuleDefinitionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
  /module-definitions/{module_definition}:
    parameters:
    - name: module_definition
      in: path
      required: true
      schema:
        type: string
      description: The module definition's ID, or its key (e.g. `catalog_pricing`).
    get:
      operationId: GetModuleDefinition
      summary: Get a module definition
      tags:
      - module-definitions
      description: Returns a single module definition by ID or by key.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /module-definitions/{module_definition}/fields:
    parameters:
    - name: module_definition
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the module definition.
    get:
      operationId: ListModuleFields
      summary: List fields
      tags:
      - module-fields
      description: Returns fields.
      parameters:
      - $ref: '#/components/parameters/maxPageSize'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/orderBy'
      responses:
        '200':
          $ref: '#/components/responses/ModuleFieldsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: CreateModuleField
      summary: Create a module field
      tags:
      - module-fields
      description: Creates a module field.
      parameters:
      - $ref: '#/components/parameters/clientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleField'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleField'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A resource with the same unique key already exists.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /module-definitions/{module_definition}/fields/{field}:
    parameters:
    - name: module_definition
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the module definition.
    - name: field
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the field.
    get:
      operationId: GetModuleField
      summary: Get a module field
      tags:
      - module-fields
      description: Returns a single module field.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleField'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: UpdateModuleField
      summary: Update a module field
      tags:
      - module-fields
      description: Partially updates a module field. Fields not sent are left unchanged.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              x-aep-resource:
                singular: module-field
                plural: fields
              properties:
                label:
                  type: string
                default_value:
                  type: object
                  additionalProperties: true
                  nullable: true
                required:
                  type: boolean
                position:
                  type: integer
                  format: int32
                help_text:
                  type: string
                  nullable: true
                visible_when_field_id:
                  type: string
                  format: uuid
                  nullable: true
                visible_when_value:
                  type: object
                  additionalProperties: true
                  nullable: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleField'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict or unique-key collision.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: DeleteModuleField
      summary: Delete a module field
      tags:
      - module-fields
      description: Deletes a module field.
      responses:
        '204':
          $ref: '#/components/responses/EmptyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /blueprints/{blueprint}/modules:
    parameters:
    - name: blueprint
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the blueprint.
    get:
      operationId: ListBlueprintModules
      summary: List modules
      tags:
      - blueprint-modules
      description: Returns modules.
      parameters:
      - $ref: '#/components/parameters/maxPageSize'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/orderBy'
      responses:
        '200':
          $ref: '#/components/responses/BlueprintModulesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: CreateBlueprintModule
      summary: Create a blueprint module
      tags:
      - blueprint-modules
      description: Creates a blueprint module.
      parameters:
      - $ref: '#/components/parameters/clientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlueprintModule'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintModule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A resource with the same unique key already exists.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /blueprints/{blueprint}/modules/{module}:
    parameters:
    - name: blueprint
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the blueprint.
    - name: module
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the module.
    get:
      operationId: GetBlueprintModule
      summary: Get a blueprint module
      tags:
      - blueprint-modules
      description: Returns a single blueprint module.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintModule'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
