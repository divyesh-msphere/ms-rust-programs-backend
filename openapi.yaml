      - discount
    UpdateDomainDiscountLevelBody:
      type: object
      description: 'Request body: the change under `discount`. `path` is read-only and ignored on input.'
      x-aep-resource:
        patterns:
        - programs/{program}/store-discount-levels/domains/{website_id}
        singular: domain-level
        plural: domain-levels
        type: msrestapi.com/programs/domain-level
      properties:
        path:
          type: string
          readOnly: true
        discount:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/DiscountPatch'
          description: The change, or `null` to revert everything to the inherited values. The key itself
            is required.
      required:
      - discount
    UpdateProgramDiscountLevelBody:
      type: object
      description: 'Request body: the change under `discount`. `path` is read-only and ignored on input.'
      x-aep-resource:
        patterns:
        - programs/{program}/store-discount-levels/program
        singular: program-level
        plural: program-levels
        type: msrestapi.com/programs/program-level
      properties:
        path:
          type: string
          readOnly: true
        discount:
          nullable: true
