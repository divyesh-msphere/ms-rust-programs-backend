        with is checked (a percentage cannot pass 100). The program must have the Store Discounts Control
        Panel module switched on (400 otherwise). It is a configuration change: it bumps `config_version`
        (the module requires publish, so the Overview shows "unpublished changes"), writes an audit entry
        and an outbox event, in one transaction. A request that changes nothing writes nothing.'
