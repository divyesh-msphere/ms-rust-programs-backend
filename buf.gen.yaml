version: v2

inputs:
  - git_repo: ssh://git@github.com/MobileSentrix/ms-protos.git
    subdir: proto
    branch: release/global_settings_proto
    paths:
      - programs/v1

plugins:
  # Message types. connect-rust (ConnectRPC's Rust implementation, replacing
  # tonic/prost) uses buffa instead of prost. Pinned to a BSR remote plugin
  # rather than `local: protoc-gen-buffa` — the crates.io-published binary
  # (`cargo install protoc-gen-buffa`) sends a malformed CodeGeneratorResponse
  # (FEATURE_SUPPORTS_EDITIONS set with no minimum_edition) that buf rejects;
  # the BSR-hosted build doesn't have that bug. No local plugin install needed.
  - remote: buf.build/anthropics/buffa:v0.9.2
    out: src/adapters/generated/grpc_services/buffa
    opt:
      - views=true
      - json=true
      - file_per_package=true

  # Service traits + clients, referencing the buffa output above.
  - remote: buf.build/connectrpc/rust:v0.9.0
    out: src/adapters/generated/grpc_services/connect
    opt:
      - buffa_module=crate::adapters::generated::grpc_services::buffa
      - file_per_package