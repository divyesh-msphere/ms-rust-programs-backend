[package]
name = "global-settings"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "global_settings_grpc"
path = "src/main_grpc.rs"

[[bin]]
name = "global_settings_http"
path = "src/main_http.rs"

[[bin]]
name = "global_settings"
path = "src/main.rs"

[dependencies]
actix-web = "4.13.0"
async-trait = "0.1.89"
config = "0.15.23"
derive_more = "2.1.1"
serde = { version = "1.0.149", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "sqlx-postgres",
    "macros",
    "json",
    "tls-native-tls",
    "default",
] }
thiserror = "2.0.18"
tokio = "1.52.3"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
prost = "0.14.3"
prost-types = "0.14.3"
uuid = { version = "1.23.1", features = ["serde", "v4", "v7"] }
ms-telemetry-rs = { git = "ssh://git@github.com/Mobilesentrix/ms-telemetry-rs.git", tag = "v0.1.1" }
tracing-actix-web = "0.7.21"
tracing = "0.1.44"
chrono = { version = "0.4.44", features = ["serde"] }
