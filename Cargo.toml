[package]
name = "programs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "programs_grpc"
path = "src/main_grpc.rs"

[[bin]]
name = "programs_http"
path = "src/main_http.rs"

[[bin]]
name = "programs"
path = "src/main.rs"

[dependencies]
actix-web = "4.13.0"
async-trait = "0.1.89"
config = "0.15.23"
dotenvy = "0.15.7"
derive_more = "2.1.1"
serde = { version = "1.0.149", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "sqlx-postgres",
    "macros",
    "json",
    "tls-native-tls",
    "default",
] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
uuid = { version = "1.23.1", features = ["serde", "v4", "v7"] }
ms-telemetry-rs = { git = "ssh://git@github.com/Mobilesentrix/ms-telemetry-rs.git", tag = "v0.1.1" }
zen-engine = { git = "ssh://git@github.com/Mobilesentrix/zen.git", branch = "feat/database-node" }
tracing-actix-web = "0.7.21"
tracing = "0.1.44"
chrono = { version = "0.4.44", features = ["serde"] }
connectrpc = { version = "0.9", features = ["server", "client"] }
connectrpc-reflection = "0.9"
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
actix-cors = "0.7.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
futures = "0.3.34"
