    plural: "rule-sets"
    pattern: "programs/{program}/rule-sets/{rule_set}"
  };

  string path = 1 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  // The rule set row, created when the leaf is made a rule leaf; unset only if it does not exist yet.
  optional string id = 2 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  // The rule leaf's module key: how a rule set is addressed.
  string module_key = 3 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  string module_name = 4 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  optional string rule_type = 5 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
