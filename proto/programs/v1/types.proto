  int32 version = 3 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  // "draft" (the newest save), "published" (live) or "superseded".
  string status = 4 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  // The rule model the builder draws. Only on a single read.
  optional google.protobuf.Value definition = 5 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
  // The generated decision graph. Only on a single read.
