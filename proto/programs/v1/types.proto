  string name = 2 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_REQUIRED];
  // Defaults to the General folder.
  optional string folder_id = 3 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
  string content_type = 4 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_REQUIRED];
  int64 size_bytes = 5 [jstype = JS_NUMBER, (aep.api.field_info).field_behavior = FIELD_BEHAVIOR_REQUIRED];
  // SHA-256 of the file in hex; when given, the storage itself refuses an upload that differs.
  optional string checksum = 6 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
  // AEP resource path of the PARENT this request scopes to (gRPC-only; required for authorization). HTTP is unaffected.
  string path = 7 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_REQUIRED];
}
