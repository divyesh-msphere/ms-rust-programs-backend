message DocumentFolder {
  option (aep.api.resource) = {
    type: "programs.mobilesentrix.com/document-folder"
    singular: "document-folder"
    plural: "document-folders"
    pattern: "programs/{program}/document-folders/{folder}"
  };

  string path = 1 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  string id = 2 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  optional string parent_id = 3 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
  string name = 4 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_REQUIRED];
  // "general", "import_artifacts", "program_documents", "store_enrollment_documents"; unset for a custom folder.
  optional string key = 5 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  // A system folder cannot be renamed or deleted.
  bool system = 6 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  int32 document_count = 7 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  string create_time = 8 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  string update_time = 9 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
}

message Document {
  option (aep.api.resource) = {
    type: "programs.mobilesentrix.com/document"
    singular: "document"
