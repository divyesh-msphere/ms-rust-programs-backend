  option (aep.api.resource) = {
    type: "programs.mobilesentrix.com/store-discount"
    singular: "store-discount"
    plural: "store-discounts"
    pattern: "programs/{program}/store-discounts/{enrollment}"
  };

  string path = 1 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  // The enrollment id.
  string id = 2 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  string store_id = 3 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
