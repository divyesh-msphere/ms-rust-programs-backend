// ---------------------------------------------------------------------------
// Store discounts (each enrolled store's effective discount: Program -> Domain -> Store)
// ---------------------------------------------------------------------------

// What ONE level sets. A field that is unset is inherited from the level above.
message DiscountConfig {
  optional bool enabled = 1 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
  // "percentage" or "fixed".
  optional string type = 2 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
  optional double amount = 3 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
  // Three uppercase letters, for example "USD".
  optional string currency_code = 4 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
}

// The discount a store actually gets.
message ResolvedDiscount {
  bool enabled = 1 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  string type = 2 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  double amount = 3 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  optional string currency_code = 4 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
}

// Which level each resolved field came from: "program", "domain" or "store".
message DiscountSources {
  string enabled = 1 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  string type = 2 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  string amount = 3 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  string currency_code = 4 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
}

// A change to one level. A field you set is set; a field named in `revert_fields` goes back to the
// inherited value; `revert_all` reverts everything (and must not be combined with the rest).
message DiscountChange {
  optional bool enabled = 1 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
  optional string type = 2 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
  optional double amount = 3 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
  optional string currency_code = 4 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
  // Any of "enabled", "type", "amount", "currency_code".
  repeated string revert_fields = 5 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
  bool revert_all = 6 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OPTIONAL];
}

