// A request the BROWSER makes straight to the object storage. Send the headers exactly as given: they are part
// of the signature. The file bytes never travel over gRPC or through this service.
message StorageRequest {
  string url = 1 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  string method = 2 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  map<string, string> headers = 3 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
  string expires_time = 4 [(aep.api.field_info).field_behavior = FIELD_BEHAVIOR_OUTPUT_ONLY];
}

