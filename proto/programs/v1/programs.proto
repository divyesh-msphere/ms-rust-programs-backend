syntax = "proto3";
package programs.v1;

import "google/protobuf/empty.proto";
import "msapi/v1/annotations.proto";
import "programs/v1/types.proto";

service ProgramsService {
  // ---- Module definitions (read-only) ----
  rpc ListModuleDefinitions(ListModuleDefinitionsRequest) returns (ListModuleDefinitionsResponse) {
    option (msapi.v1.sso_permission) = {permission: "programs.module_definitions" action: "reader" collection_scope: true};
  }
  rpc GetModuleDefinition(GetModuleDefinitionRequest) returns (GetModuleDefinitionResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.module_definitions"
      action: "reader"
      resource_fields: [{field: "path" pattern: "module-definitions/*"}]
    };
  }

  // ---- Programs ----
  rpc ListPrograms(ListProgramsRequest) returns (ListProgramsResponse) {
    option (msapi.v1.sso_permission) = {permission: "programs.programs" action: "reader" collection_scope: true};
  }
  rpc CreateProgram(CreateProgramRequest) returns (CreateProgramResponse) {
    option (msapi.v1.sso_permission) = {permission: "programs.programs" action: "writer" collection_scope: true};
  }
  rpc GetProgram(GetProgramRequest) returns (GetProgramResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "reader"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }
  rpc UpdateProgram(UpdateProgramRequest) returns (UpdateProgramResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }
  rpc DeleteProgram(DeleteProgramRequest) returns (google.protobuf.Empty) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "admin"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }
  rpc UndeleteProgram(UndeleteProgramRequest) returns (UndeleteProgramResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "admin"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }

  // ---- Program modules (the manifest) ----
  rpc ListProgramModules(ListProgramModulesRequest) returns (ListProgramModulesResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "reader"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }

  // ---- Setting values ----
  rpc ListFieldValues(ListFieldValuesRequest) returns (ListFieldValuesResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "reader"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }
  rpc BatchUpdateFieldValues(BatchUpdateFieldValuesRequest) returns (BatchUpdateFieldValuesResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }

  // ---- Requirements ----
  rpc ListRequirements(ListRequirementsRequest) returns (ListRequirementsResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "reader"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }
  rpc GetRequirement(GetRequirementRequest) returns (GetRequirementResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "reader"
      resource_fields: [{field: "path" pattern: "programs/*/requirements/*"}]
    };
  }
  rpc CreateRequirement(CreateRequirementRequest) returns (CreateRequirementResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }
  rpc UpdateRequirement(UpdateRequirementRequest) returns (UpdateRequirementResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*/requirements/*"}]
    };
  }
  rpc DeleteRequirement(DeleteRequirementRequest) returns (google.protobuf.Empty) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*/requirements/*"}]
    };
  }
  rpc BatchUpdateRequirements(BatchUpdateRequirementsRequest) returns (BatchUpdateRequirementsResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }

  // ---- Approval steps ----
  rpc ListApprovalSteps(ListApprovalStepsRequest) returns (ListApprovalStepsResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "reader"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }
  rpc GetApprovalStep(GetApprovalStepRequest) returns (GetApprovalStepResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "reader"
      resource_fields: [{field: "path" pattern: "programs/*/approval-steps/*"}]
    };
  }
  rpc CreateApprovalStep(CreateApprovalStepRequest) returns (CreateApprovalStepResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }
  rpc UpdateApprovalStep(UpdateApprovalStepRequest) returns (UpdateApprovalStepResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*/approval-steps/*"}]
    };
  }
  rpc DeleteApprovalStep(DeleteApprovalStepRequest) returns (google.protobuf.Empty) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*/approval-steps/*"}]
    };
  }
  rpc BatchUpdateApprovalSteps(BatchUpdateApprovalStepsRequest) returns (BatchUpdateApprovalStepsResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }

  // ---- Applications ----
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "reader"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }
  rpc GetApplication(GetApplicationRequest) returns (GetApplicationResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "reader"
      resource_fields: [{field: "path" pattern: "programs/*/applications/*"}]
    };
  }
  rpc CreateApplication(CreateApplicationRequest) returns (CreateApplicationResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }
  rpc SubmitApplication(SubmitApplicationRequest) returns (SubmitApplicationResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*/applications/*"}]
    };
  }
  rpc WithdrawApplication(WithdrawApplicationRequest) returns (WithdrawApplicationResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "writer"
      resource_fields: [{field: "path" pattern: "programs/*/applications/*"}]
    };
  }

  // ---- Overview and history ----
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "reader"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse) {
    option (msapi.v1.sso_permission) = {
      permission: "programs.programs"
      action: "reader"
      resource_fields: [{field: "path" pattern: "programs/*"}]
    };
  }

  // ---- Health ----
  rpc ListHealthCheck(ListHealthCheckRequest) returns (ListHealthCheckResponse) {
    // Open to everyone (load balancer / monitoring probes) — no permission check.
    option (msapi.v1.sso_permission) = {skip: true};
  }
}
